org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.code.style=official

# The project lives in iCloud Drive, which skips names ending in .nosync: keep Gradle's cache local.
# Kotlin's (.kotlin.nosync) is set in local.properties: it needs an absolute path, which is per machine.
org.gradle.projectcachedir=.gradle.nosync
